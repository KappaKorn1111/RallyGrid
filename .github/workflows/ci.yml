name: RALLYGRID CI

on:
  push:
    branches: [main, step-01-foundation]
  pull_request:
    branches: [main, step-01-foundation]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rallygrid
          POSTGRES_USER: rallygrid
          POSTGRES_PASSWORD: rallygrid_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rallygrid -d rallygrid"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rallygrid:rallygrid_dev@localhost:5432/rallygrid
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 2567
      HOST: 127.0.0.1
      CORS_ORIGIN: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Start API and verify database and Redis readiness
        run: |
          pnpm dev:server > /tmp/rallygrid-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:2567/ready; then exit 0; fi
            sleep 2
          done
          cat /tmp/rallygrid-api.log
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
